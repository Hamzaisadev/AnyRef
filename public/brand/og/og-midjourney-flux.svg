  </text>

  <!-- Code Token Snippet Mockup -->
  <g transform="translate(100, 505)">
    <rect x="0" y="0" width="820" height="48" rx="12" fill="#000000" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="24" y="30" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">
      <tspan fill="#38BDF8">img_1.png img_2.png</tspan> studio hero for <tspan fill="#22D3EE">{{product_name}}</tspan> <tspan fill="#64748B">--sref url --cw 15 --ar 4:5 --v 6.1</tspan>
    </text>
