<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <rect width="1280" height="640" fill="#0F1020"/>
  
  <!-- Logo Mark -->
  <g transform="translate(140, 240) scale(2.4)">
    <rect x="6" y="6" width="52" height="52" rx="12" stroke="#4B2BFF" stroke-width="4"/>
    <path d="M24 20h-6v24h6M40 20h6v24h-6" stroke="#F7F6F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="4" fill="#FF8A3D"/>
  </g>
  
  <!-- Wordmark -->
  <text x="320" y="345" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="88" fill="#F7F6F2" letter-spacing="-0.04em">anyref</text>
  
  <!-- Tagline -->
  <text x="140" y="460" font-family="'Inter', sans-serif" font-weight="500" font-size="34" fill="#9AA0AE" letter-spacing="-0.01em">Any reference. Your brand. Ready to prompt.</text>
  
